####################################################
# REDIRECCIÓN http → https
####################################################
server {
    listen 80;
    server_name www-transferbasket.win;

    return 301 https://www-transferbasket.win$request_uri;
}

####################################################
# SERVIDOR HTTPS PRINCIPAL
####################################################
server {
    listen 443 ssl;
    server_name www-transferbasket.win;

    # Certificados
    ssl_certificate /etc/letsencrypt/live/www-transferbasket.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www-transferbasket.win/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ####################################################
    # FRONTEND
    ####################################################
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ####################################################
    # BACKEND API
    ####################################################
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ####################################################
    # BACKEND ASSETS
    ####################################################
    location /assets/ {
        proxy_pass http://localhost:4000/assets/;
        proxy_set_header Host $host;
    }
}

