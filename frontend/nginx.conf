events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ###############################
    # 1. Assets del FRONTEND (ficheros estáticos)
    # Servimos recursos estáticos por extensión para asegurar MIME y evitar que
    # el fallback de la SPA responda con `index.html` cuando el recurso falta.
    ###############################
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf|eot)$ {
      root /usr/share/nginx/html;
      # try_files fall back a 404 si no existe el recurso (no al index.html)
      try_files $uri =404;
      access_log off;
      # Caching agresivo para recursos con hash en su nombre
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # En caso de que uses otra estructura y quieras seguir usando /assets/ prefix
    # mantenemos una regla específica para ese prefijo que delega en la anterior.
    location /assets/ {
      try_files $uri =404;
    }

    ###############################
    # 2. Assets del BACKEND (FOTOS)
    ###############################
    location /backend-assets/ {
      # Redirigimos a backend/assets
      rewrite ^/backend-assets/(.*)$ /assets/$1 break;
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
    }

    ###############################
    # 3. API del backend
    ###############################
    location /api {
      proxy_pass http://backend:4000/api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    ###############################
    # 4. SPA fallback
    ###############################
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}