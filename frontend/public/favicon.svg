<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-labelledby="title desc">
  <title id="title">Pelota de baloncesto</title>
  <desc id="desc">Icono simple de pelota de baloncesto naranja con líneas negras.</desc>

  <!-- Círculo base -->
  <circle cx="32" cy="32" r="30" fill="#f58220" stroke="#000" stroke-width="2"/>

  <!-- Costuras / líneas -->
  <path d="M20 8 C28 24 28 40 20 56" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 8 C36 24 36 40 44 56" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Línea horizontal superior e inferior (curvas que forman la banda) -->
  <path d="M8 32 C24 24 40 24 56 32" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
